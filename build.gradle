import com.vanniktech.maven.publish.SonatypeHost


plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.vanniktech.maven.publish" version "0.28.0"
    id 'signing'
}

group = 'io.github.benchpress200'
version = '0.0.1'

repositories {
    mavenCentral()
}

tasks.withType(Javadoc) {
    options {
        encoding 'UTF-8'
    }
}

signing {
    sign publishing.publications
}

mavenPublishing {
    signAllPublications()
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

    coordinates("io.github.benchpress200", "api-response", "0.0.1")

    pom {
        name = 'api-response'
        description = 'A simple Spring API response builder'
        url = 'https://github.com/BenchPress200/api-response'

        // 라이선스 정보
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        // 개발자 정보
        developers {
            developer {
                id = 'benchpress200'
                name = 'Mineong Jeong'
                email = 'jms0538@naver.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/BenchPress200/api-response.git'
            developerConnection = 'scm:git:ssh://github.com:BenchPress200/api-response.git'
            url = 'https://github.com/BenchPress200/api-response/tree/main'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.5'
}
